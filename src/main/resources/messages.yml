    - "&#FFFF55/sytarla hologram taşı [ad] &#8250; &#FFFFFFHologramı bulunduğunuz yere taşır."
    - "&#FFFF55/sytarla hologram rotate <açı> [ad] &#8250; &#FFFFFFHologramı yatay eksende döndürür."
    - "&#FFFF55/sytarla hologram rotatepitch <açı> [ad] &#8250; &#FFFFFFHologramı dikey eksende döndürür."
    - "&#FFFF55/sytarla hologram textshadow <aç|kapat> [ad] &#8250; &#FFFFFFGölgeyi ayarlar."
    - "&#FFFF55/sytarla hologram background <şeffaf|normal> [ad] &#8250; &#FFFFFFArka planı ayarlar."
    - "&#FFFF55/sytarla hologram billboard <center|fixed|vertical|horizontal> [ad] &#8250; &#FFFFFFYön modunu ayarlar."
